name: EMHASS GUI Custom
description: Energy Management for Home Assistant (custom GUI)
url: https://github.com/JoshC1994/emhass-add-on
version: v20260726-0b2895c #set if use image container version
slug: emhass_gui_custom
arch:
  - aarch64
  - amd64
"image": "ghcr.io/joshc1994/emhass"
ports:
  5000/tcp: 5000
ports_description:
  5001/tcp: Web interface and API
webui: http://[HOST]:[PORT:5000]
map:
  - share:rw
  - type: addon_config
    path: /config
    read_only: False
init: false
hassio_role: default
homeassistant_api: true
ingress: true
ingress_port: 5000
ingress_stream: true
panel_icon: mdi:home-lightning-bolt-outline
panel_title: EMHASS GUI Custom
schema:
  hass_url: "str?" 
  long_lived_token: "password?" 
  data_path: "list(default|/config|/data|/share|/share/emhass)?" 
  config_path: "list(default|/config/config.json|/share/config.json|/share/emhass/config.json)?" 
  time_zone: "match((\\w+)?(\\/)(\\w+))?" 
  Latitude: "float?" 
  Longitude: "float?" 
  Altitude: "float?" 
  solcast_api_key: "password?" 
  solcast_rooftop_id: "str?" 
  solar_forecast_kwp: "float?" 
  server_ip: "list(0.0.0.0|127.0.0.1)?" 
  influxdb_username: "str?" 
  influxdb_password: "password?" 
