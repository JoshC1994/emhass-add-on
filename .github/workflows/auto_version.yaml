name: Auto Version and Sync Addon

on:
  repository_dispatch:
    types:
      - emhass-branch-sync

  workflow_dispatch:
    inputs:
      branch_name:
        description: Branch name from the EMHASS repository
        required: true
        default: master
        type: string
      commit_sha:
        description: Full commit SHA from the EMHASS repository
        required: true
        type: string
      short_sha:
        description: Seven-character commit SHA
        required: true
        type: string
      base_version:
        description: EMHASS base version
        required: true
        default: 0.18.1
        type: string

permissions:
  contents: write

jobs:
  sync-addon:
    name: Sync branch add-on
    runs-on: ubuntu-latest

    steps:
      - name: Check out add-on repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read sync inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch_name }}
          DISPATCH_COMMIT: ${{ github.event.client_payload.commit_sha }}
          DISPATCH_SHORT_SHA: ${{ github.event.client_payload.short_sha }}
          DISPATCH_VERSION: ${{ github.event.client_payload.base_version }}
          MANUAL_BRANCH: ${{ inputs.branch_name }}
          MANUAL_COMMIT: ${{ inputs.commit_sha }}
          MANUAL_SHORT_SHA: ${{ inputs.short_sha }}
          MANUAL_VERSION: ${{ inputs.base_version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            branch="$DISPATCH_BRANCH"
            commit_sha="$DISPATCH_COMMIT"
            short_sha="$DISPATCH_SHORT_SHA"
            base_version="$DISPATCH_VERSION"
          else
            branch="$MANUAL_BRANCH"
            commit_sha="$MANUAL_COMMIT"
            short_sha="$MANUAL_SHORT_SHA"
            base_version="$MANUAL_VERSION"
          fi

          if [ -z "$branch" ]; then
            echo "Branch name is empty."
            exit 1
          fi

          if [ -z "$commit_sha" ]; then
            echo "Commit SHA is empty."
            exit 1
          fi

          if [ -z "$short_sha" ]; then
            echo "Short SHA is empty."
            exit 1
          fi

          if [ -z "$base_version" ]; then
            echo "Base version is empty."
            exit 1
          fi

          {
            echo "branch=$branch"
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "base_version=$base_version"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate add-on metadata
        id: addon
        shell: bash
        env:
          BRANCH: ${{ steps.inputs.outputs.branch }}
          COMMIT_SHA: ${{ steps.inputs.outputs.commit_sha }}
          SHORT_SHA: ${{ steps.inputs.outputs.short_sha }}
          BASE_VERSION: ${{ steps.inputs.outputs.base_version }}
        run: |
          set -euo pipefail

          safe_branch="$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')"

          if [ -z "$safe_branch" ]; then
            echo "Branch name cannot be converted into a valid Docker tag."
            exit 1
          fi

          if [ "$BRANCH" = "master" ]; then
            addon_dir="emhass"
            addon_name="EMHASS"
          else
            addon_dir="emhass-${safe_branch}"
            addon_name="EMHASS (${BRANCH})"
          fi

          addon_version="${BASE_VERSION}-${SHORT_SHA}-${safe_branch}"

          {
            echo "addon_dir=$addon_dir"
            echo "addon_name=$addon_name"
            echo "addon_version=$addon_version"
            echo "branch=$BRANCH"
            echo "commit_sha=$COMMIT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Create branch add-on from production template
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
        run: |
          set -euo pipefail

          if [ "$ADDON_DIR" = "emhass" ]; then
            exit 0
          fi

          if [ ! -d "emhass" ]; then
            echo "Production template directory emhass does not exist."
            exit 1
          fi

          if [ ! -d "$ADDON_DIR" ]; then
            cp -R emhass "$ADDON_DIR"
          fi

      - name: Update branch add-on metadata
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
          ADDON_NAME: ${{ steps.addon.outputs.addon_name }}
          ADDON_VERSION: ${{ steps.addon.outputs.addon_version }}
        run: |
          set -euo pipefail

          CONFIG_FILE="$ADDON_DIR/config.yml"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Missing template config file: $CONFIG_FILE"
            exit 1
          fi

          python3 - "$CONFIG_FILE" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          config_path = Path(sys.argv[1])

          addon_dir = os.environ["ADDON_DIR"]
          addon_name = os.environ["ADDON_NAME"]
          addon_version = os.environ["ADDON_VERSION"]

          text = config_path.read_text(encoding="utf-8")

          text, name_count = re.subn(
              r"^name:.*$",
              f'name: "{addon_name}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )

          text, version_count = re.subn(
              r"^version:.*$",
              f'version: "{addon_version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )

          text, slug_count = re.subn(
              r"^slug:.*$",
              f"slug: {addon_dir}",
              text,
              count=1,
              flags=re.MULTILINE,
          )

          if name_count != 1:
              raise SystemExit("Template config.yml does not contain a name field.")

          if version_count != 1:
              raise SystemExit("Template config.yml does not contain a version field.")

          if slug_count != 1:
              raise SystemExit("Template config.yml does not contain a slug field.")

          config_path.write_text(text, encoding="utf-8")
          PY

      - name: Confirm Supervisor API permissions
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
        run: |
          set -euo pipefail

          CONFIG_FILE="$ADDON_DIR/config.yml"

          if ! grep -q '^hassio_api: true$' "$CONFIG_FILE"; then
            printf '\nhassio_api: true\n' >> "$CONFIG_FILE"
          fi

          if ! grep -q '^homeassistant_api: true$' "$CONFIG_FILE"; then
            printf 'homeassistant_api: true\n' >> "$CONFIG_FILE"
          fi

      - name: Commit generated add-on
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
          ADDON_VERSION: ${{ steps.addon.outputs.addon_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$ADDON_DIR"

          if git diff --cached --quiet; then
            echo "No add-on changes to commit."
            exit 0
          fi

          git commit -m "Update ${ADDON_DIR} to ${ADDON_VERSION}"
          git push
