name: Auto Version and Sync Addon

on:
  repository_dispatch:
    types:
      - emhass-branch-sync

  workflow_dispatch:
    inputs:
      branch_name:
        description: Branch name from the EMHASS repository
        required: true
        default: master
        type: string
      commit_sha:
        description: Full commit SHA from the EMHASS repository
        required: true
        type: string
      short_sha:
        description: Seven-character commit SHA
        required: true
        type: string
      base_version:
        description: EMHASS base version
        required: true
        default: 0.18.1
        type: string

permissions:
  contents: write

jobs:
  sync-addon:
    name: Sync branch add-on
    runs-on: ubuntu-latest

    steps:
      - name: Check out add-on repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read sync inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch_name }}
          DISPATCH_COMMIT: ${{ github.event.client_payload.commit_sha }}
          DISPATCH_SHORT_SHA: ${{ github.event.client_payload.short_sha }}
          DISPATCH_VERSION: ${{ github.event.client_payload.base_version }}
          MANUAL_BRANCH: ${{ inputs.branch_name }}
          MANUAL_COMMIT: ${{ inputs.commit_sha }}
          MANUAL_SHORT_SHA: ${{ inputs.short_sha }}
          MANUAL_VERSION: ${{ inputs.base_version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            branch="$DISPATCH_BRANCH"
            commit_sha="$DISPATCH_COMMIT"
            short_sha="$DISPATCH_SHORT_SHA"
            base_version="$DISPATCH_VERSION"
          else
            branch="$MANUAL_BRANCH"
            commit_sha="$MANUAL_COMMIT"
            short_sha="$MANUAL_SHORT_SHA"
            base_version="$MANUAL_VERSION"
          fi

          if [ -z "$branch" ] || [ -z "$commit_sha" ] || [ -z "$short_sha" ] || [ -z "$base_version" ]; then
            echo "Branch, commit SHA, short SHA, and base version are all required."
            exit 1
          fi

          {
            echo "branch=$branch"
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "base_version=$base_version"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate add-on metadata
        id: addon
        shell: bash
        env:
          BRANCH: ${{ steps.inputs.outputs.branch }}
          COMMIT_SHA: ${{ steps.inputs.outputs.commit_sha }}
          SHORT_SHA: ${{ steps.inputs.outputs.short_sha }}
          BASE_VERSION: ${{ steps.inputs.outputs.base_version }}
        run: |
          set -euo pipefail

          safe_branch="$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')"

          if [ -z "$safe_branch" ]; then
            echo "Branch name cannot be converted into a valid add-on slug."
            exit 1
          fi

          if [ "$BRANCH" = "master" ]; then
            addon_dir="emhass"
            addon_name="EMHASS"
            panel_title="EMHASS"
          else
            addon_dir="emhass-${safe_branch}"
            addon_name="EMHASS (${BRANCH})"
            panel_title="EMHASS ${BRANCH}"
          fi

          addon_version="${BASE_VERSION}-${SHORT_SHA}-${safe_branch}"

          {
            echo "addon_dir=$addon_dir"
            echo "addon_name=$addon_name"
            echo "panel_title=$panel_title"
            echo "addon_version=$addon_version"
            echo "branch=$BRANCH"
            echo "commit_sha=$COMMIT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Create branch add-on from production template
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
        run: |
          set -euo pipefail

          if [ "$ADDON_DIR" = "emhass" ]; then
            exit 0
          fi

          if [ ! -d "emhass" ]; then
            echo "Missing production template folder: emhass"
            exit 1
          fi

          rm -rf "$ADDON_DIR"
          cp -R emhass "$ADDON_DIR"

      - name: Update branch add-on manifest
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
          ADDON_NAME: ${{ steps.addon.outputs.addon_name }}
          PANEL_TITLE: ${{ steps.addon.outputs.panel_title }}
          ADDON_VERSION: ${{ steps.addon.outputs.addon_version }}
          BRANCH: ${{ steps.addon.outputs.branch }}
        run: |
          set -euo pipefail

          CONFIG_FILE="$ADDON_DIR/config.yml"

          python3 - "$CONFIG_FILE" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          replacements = {
              "name": os.environ["ADDON_NAME"],
              "description": f"EMHASS branch build for {os.environ['BRANCH']}",
              "url": "https://github.com/JoshC1994/emhass",
              "version": f'"{os.environ["ADDON_VERSION"]}"',
              "slug": os.environ["ADDON_DIR"],
              "image": '"ghcr.io/joshc1994/emhass"',
              "panel_title": os.environ["PANEL_TITLE"],
          }

          for key, value in replacements.items():
              pattern = rf"^{re.escape(key)}:.*$"
              replacement = f"{key}: {value}"
              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one '{key}:' entry in {path}."
                  )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate required Ingress settings
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
        run: |
          set -euo pipefail

          CONFIG_FILE="$ADDON_DIR/config.yml"

          grep -q '^ingress: true$' "$CONFIG_FILE"
          grep -q '^ingress_port: 5000$' "$CONFIG_FILE"
          grep -q '^homeassistant_api: true$' "$CONFIG_FILE"
          grep -q '^hassio_role: default$' "$CONFIG_FILE"
          grep -q '^webui: http://\[HOST\]:\[PORT:5000\]$' "$CONFIG_FILE"

      - name: Commit generated add-on
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
          ADDON_VERSION: ${{ steps.addon.outputs.addon_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$ADDON_DIR"

          if git diff --cached --quiet; then
            echo "No add-on changes to commit."
            exit 0
          fi

          git commit -m "Update ${ADDON_DIR} to ${ADDON_VERSION}"
          git push
