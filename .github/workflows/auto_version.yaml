name: Auto Version and Sync Addon

on:
  repository_dispatch:
    types: [emhass-branch-sync]
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name from emhass repo'
        required: true
        default: 'master'
      commit_sha:
        description: 'Full commit SHA'
        required: true
      short_sha:
        description: 'Short commit SHA (7 chars)'
        required: true
      base_version:
        description: 'Base version from pyproject.toml'
        required: true
        default: '0.18.1'

jobs:
  sync-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "branch_name=${{ github.event.client_payload.branch_name }}" >> $GITHUB_OUTPUT
            echo "commit_sha=${{ github.event.client_payload.commit_sha }}" >> $GITHUB_OUTPUT
            echo "short_sha=${{ github.event.client_payload.short_sha }}" >> $GITHUB_OUTPUT
            echo "base_version=${{ github.event.client_payload.base_version }}" >> $GITHUB_OUTPUT
          else
            echo "branch_name=${{ github.event.inputs.branch_name }}" >> $GITHUB_OUTPUT
            echo "commit_sha=${{ github.event.inputs.commit_sha }}" >> $GITHUB_OUTPUT
            echo "short_sha=${{ github.event.inputs.short_sha }}" >> $GITHUB_OUTPUT
            echo "base_version=${{ github.event.inputs.base_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine addon directory
        id: addon-dir
        run: |
          BRANCH="${{ steps.inputs.outputs.branch_name }}"
          if [ "$BRANCH" = "master" ]; then
            ADDON_DIR="emhass"
            ADDON_NAME="EMHASS"
          else
            # Sanitize branch name for directory (replace / with -)
            SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
            ADDON_DIR="emhass-${SAFE_BRANCH}"
            ADDON_NAME="EMHASS (${BRANCH})"
          fi
          echo "addon_dir=$ADDON_DIR" >> $GITHUB_OUTPUT
          echo "addon_name=$ADDON_NAME" >> $GITHUB_OUTPUT

      - name: Create addon directory if not exists
        run: |
          mkdir -p "${{ steps.addon-dir.outputs.addon_dir }}"

      - name: Copy addon files from template
        run: |
          ADDON_DIR="${{ steps.addon-dir.outputs.addon_dir }}"
          # Copy from emhass-test as template
          if [ "$ADDON_DIR" != "emhass" ] && [ "$ADDON_DIR" != "emhass-test" ]; then
            cp -n emhass-test/DOCS.md "$ADDON_DIR/" 2>/dev/null || true
            cp -n emhass-test/README.md "$ADDON_DIR/" 2>/dev/null || true
            cp -n emhass-test/Test.md "$ADDON_DIR/" 2>/dev/null || true
            cp -n emhass-test/build.yaml "$ADDON_DIR/" 2>/dev/null || true
            cp -n emhass-test/icon.png "$ADDON_DIR/" 2>/dev/null || true
            cp -n emhass-test/logo.png "$ADDON_DIR/" 2>/dev/null || true
            mkdir -p "$ADDON_DIR/images"
            mkdir -p "$ADDON_DIR/translations"
          fi

      - name: Generate config.yml
        run: |
          ADDON_DIR="${{ steps.addon-dir.outputs.addon_dir }}"
          ADDON_NAME="${{ steps.addon-dir.outputs.addon_name }}"
          VERSION="${{ steps.inputs.outputs.base_version }}-${{ steps.inputs.outputs.short_sha }}"
          BRANCH="${{ steps.inputs.outputs.branch_name }}"
          
          cat > "$ADDON_DIR/config.yml" << EOF
name: $ADDON_NAME
version: $VERSION
slug: $ADDON_DIR
description: EMHASS energy management system - Branch: $BRANCH
url: https://github.com/JoshC1994/emhass
arch:
  - amd64
  - aarch64
  - armhf
  - armv7
homeassistant: 2023.1.0
image: ghcr.io/joshc1994/emhass
init: false
map:
  - all:rw
options:
  no_entity_fetching: false
  publish_prefix: ""
  solcast_api_key: ""
  solcast_site_id: ""
  weather_entity: ""
  location_lat: ""
  location_lon: ""
  alt: 0
  module_power: 0
  module_count: 0
  inverter_power: 0
  Pd: 0
  eff: 100
  Pmax: 1000
  def_load: 0
schema:
  no_entity_fetching: bool
  publish_prefix: str
  solcast_api_key: str
  solcast_site_id: str
  weather_entity: str
  location_lat: str
  location_lon: str
  alt: int
  module_power: int
  module_count: int
  inverter_power: int
  Pd: int
  eff: int
  Pmax: int
  def_load: int
startup: services
boot: auto
ports:
  80/tcp: null
ports_description:
  80/tcp: EMHASS Web UI
environment:
  BRANCH: $BRANCH
  COMMIT_SHA: ${{ steps.inputs.outputs.commit_sha }}
EOF

      - name: Update repository.yaml
        run: |
          ADDON_DIR="${{ steps.addon-dir.outputs.addon_dir }}"
          # Check if addon already in repository.yaml
          if ! grep -q "slug: $ADDON_DIR" repository.yaml; then
            # Add new addon entry
            cat >> repository.yaml << EOF

- slug: $ADDON_DIR
  name: ${{ steps.addon-dir.outputs.addon_name }}
  repository: https://github.com/JoshC1994/emhass-add-on
EOF
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Sync addon ${{ steps.addon-dir.outputs.addon_dir }} to version ${{ steps.inputs.outputs.base_version }}-${{ steps.inputs.outputs.short_sha }}"
            git push
          else
            echo "No changes to commit"
          fi
