name: Auto Version and Sync Addon

on:
  repository_dispatch:
    types:
      - emhass-branch-sync

  workflow_dispatch:
    inputs:
      branch_name:
        description: Branch name from the EMHASS repository
        required: true
        default: master
        type: string
      commit_sha:
        description: Full commit SHA from the EMHASS repository
        required: true
        type: string
      short_sha:
        description: Seven-character commit SHA
        required: true
        type: string
      base_version:
        description: EMHASS base version
        required: true
        default: 0.18.1
        type: string

permissions:
  contents: write

jobs:
  sync-addon:
    name: Sync branch add-on
    runs-on: ubuntu-latest

    steps:
      - name: Check out add-on repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read sync inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch_name }}
          DISPATCH_COMMIT: ${{ github.event.client_payload.commit_sha }}
          DISPATCH_SHORT_SHA: ${{ github.event.client_payload.short_sha }}
          DISPATCH_VERSION: ${{ github.event.client_payload.base_version }}
          MANUAL_BRANCH: ${{ inputs.branch_name }}
          MANUAL_COMMIT: ${{ inputs.commit_sha }}
          MANUAL_SHORT_SHA: ${{ inputs.short_sha }}
          MANUAL_VERSION: ${{ inputs.base_version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            branch="$DISPATCH_BRANCH"
            commit_sha="$DISPATCH_COMMIT"
            short_sha="$DISPATCH_SHORT_SHA"
            base_version="$DISPATCH_VERSION"
          else
            branch="$MANUAL_BRANCH"
            commit_sha="$MANUAL_COMMIT"
            short_sha="$MANUAL_SHORT_SHA"
            base_version="$MANUAL_VERSION"
          fi

          if [ -z "$branch" ]; then
            echo "Branch name is empty."
            exit 1
          fi

          if [ -z "$commit_sha" ]; then
            echo "Commit SHA is empty."
            exit 1
          fi

          if [ -z "$short_sha" ]; then
            echo "Short SHA is empty."
            exit 1
          fi

          if [ -z "$base_version" ]; then
            echo "Base version is empty."
            exit 1
          fi

          {
            echo "branch=$branch"
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "base_version=$base_version"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate add-on metadata
        id: addon
        shell: bash
        env:
          BRANCH: ${{ steps.inputs.outputs.branch }}
          COMMIT_SHA: ${{ steps.inputs.outputs.commit_sha }}
          SHORT_SHA: ${{ steps.inputs.outputs.short_sha }}
          BASE_VERSION: ${{ steps.inputs.outputs.base_version }}
        run: |
          set -euo pipefail

          safe_branch="$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')"

          if [ -z "$safe_branch" ]; then
            echo "Branch name cannot be converted into a valid Docker tag."
            exit 1
          fi

          if [ "$BRANCH" = "master" ]; then
            addon_dir="emhass"
            addon_name="EMHASS"
          else
            addon_dir="emhass-${safe_branch}"
            addon_name="EMHASS (${BRANCH})"
          fi

          addon_version="${BASE_VERSION}-${SHORT_SHA}-${safe_branch}"

          {
            echo "addon_dir=$addon_dir"
            echo "addon_name=$addon_name"
            echo "addon_version=$addon_version"
            echo "branch=$BRANCH"
            echo "commit_sha=$COMMIT_SHA"
            echo "safe_branch=$safe_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Create branch add-on from template
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
        run: |
          set -euo pipefail

          if [ "$ADDON_DIR" = "emhass" ]; then
            exit 0
          fi

          if [ ! -d "$ADDON_DIR" ]; then
            cp -R emhass-test "$ADDON_DIR"
          fi

      - name: Write add-on configuration
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
          ADDON_NAME: ${{ steps.addon.outputs.addon_name }}
          ADDON_VERSION: ${{ steps.addon.outputs.addon_version }}
          BRANCH: ${{ steps.addon.outputs.branch }}
          COMMIT_SHA: ${{ steps.addon.outputs.commit_sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          addon_dir = Path(os.environ["ADDON_DIR"])
          config_path = addon_dir / "config.yml"

          config = f"""name: {os.environ["ADDON_NAME"]}
          version: "{os.environ["ADDON_VERSION"]}"
          slug: {os.environ["ADDON_DIR"]}
          description: "EMHASS branch build: {os.environ["BRANCH"]}"
          url: "https://github.com/JoshC1994/emhass"
          arch:
            - amd64
            - aarch64
          homeassistant: "2023.1.0"
          image: "ghcr.io/joshc1994/emhass"
          init: false
          map:
            - all:rw
          options:
            no_entity_fetching: false
            publish_prefix: ""
            solcast_api_key: ""
            solcast_site_id: ""
            weather_entity: ""
            location_lat: ""
            location_lon: ""
            alt: 0
            module_power: 0
            module_count: 0
            inverter_power: 0
            Pd: 0
            eff: 100
            Pmax: 1000
            def_load: 0
          schema:
            no_entity_fetching: bool
            publish_prefix: str
            solcast_api_key: str
            solcast_site_id: str
            weather_entity: str
            location_lat: str
            location_lon: str
            alt: int
            module_power: int
            module_count: int
            inverter_power: int
            Pd: int
            eff: int
            Pmax: int
            def_load: int
          startup: services
          boot: auto
          ports:
            80/tcp: null
          ports_description:
            80/tcp: EMHASS Web UI
          environment:
            EMHASS_BRANCH: "{os.environ["BRANCH"]}"
            EMHASS_COMMIT_SHA: "{os.environ["COMMIT_SHA"]}"
          """

          config_path.write_text(config, encoding="utf-8")
          PY

      - name: Commit generated add-on
        shell: bash
        env:
          ADDON_DIR: ${{ steps.addon.outputs.addon_dir }}
          ADDON_VERSION: ${{ steps.addon.outputs.addon_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$ADDON_DIR"

          if git diff --cached --quiet; then
            echo "No add-on changes to commit."
            exit 0
          fi

          git commit -m "Update ${ADDON_DIR} to ${ADDON_VERSION}"
          git push
