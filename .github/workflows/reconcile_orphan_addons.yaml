name: Reconcile Orphan Addons

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Run daily at 3 AM UTC

jobs:
  cleanup-orphans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get branches from emhass repo
        id: branches
        run: |
          BRANCHES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/JoshC1994/emhass/branches" | \
            jq -r '.[].name' | tr '\n' ' ')
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT

      - name: Find addon directories
        id: addons
        run: |
          ADDONS=$(find . -maxdepth 1 -type d -name 'emhass*' | sed 's|^\./||' | tr '\n' ' ')
          echo "addons=$ADDONS" >> $GITHUB_OUTPUT

      - name: Check for orphans and remove
        id: cleanup
        run: |
          BRANCHES="${{ steps.branches.outputs.branches }}"
          ADDONS="${{ steps.addons.outputs.addons }}"
          REMOVED=""
          
          for addon in $ADDONS; do
            # Skip protected addons
            if [ "$addon" = "emhass" ] || [ "$addon" = "emhass-test" ]; then
              continue
            fi
            
            # Extract branch name from addon directory
            BRANCH_NAME=$(echo "$addon" | sed 's/^emhass-//')
            
            # Check if branch exists
            if ! echo "$BRANCHES" | grep -qw "$BRANCH_NAME"; then
              echo "Branch $BRANCH_NAME not found, removing addon $addon"
              rm -rf "$addon"
              REMOVED="$REMOVED $addon"
            fi
          done
          
          echo "removed=$REMOVED" >> $GITHUB_OUTPUT

      - name: Update repository.yaml
        if: steps.cleanup.outputs.removed != ''
        run: |
          # Remove orphaned addons from repository.yaml
          for addon in ${{ steps.cleanup.outputs.removed }}; do
            # Remove the addon entry from repository.yaml
            sed -i "/slug: $addon/,/^$/d" repository.yaml
          done

      - name: Commit and push changes
        if: steps.cleanup.outputs.removed != ''
        run: |
          git config --local user.email "github-actions[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Remove orphaned addons: ${{ steps.cleanup.outputs.removed }}"
            git push
          else
            echo "No changes to commit"
          fi
