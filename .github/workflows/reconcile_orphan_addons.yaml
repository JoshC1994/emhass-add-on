name: Reconcile Orphan Addons

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  cleanup-orphans:
    name: Remove add-ons for deleted branches
    runs-on: ubuntu-latest

    steps:
      - name: Check out add-on repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get active EMHASS branches
        id: branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/JoshC1994/emhass/branches?per_page=100" \
            | jq -r '.[].name' \
            > /tmp/emhass-branches.txt

          echo "Active branches:"
          cat /tmp/emhass-branches.txt

      - name: Remove only confirmed orphan add-ons
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail

          removed=""

          while IFS= read -r addon_dir; do
            if [ "$addon_dir" = "emhass" ] || [ "$addon_dir" = "emhass-test" ]; then
              continue
            fi

            safe_branch="${addon_dir#emhass-}"

            found="false"

            while IFS= read -r branch; do
              normalized_branch="$(printf '%s' "$branch" \
                | tr '[:upper:]' '[:lower:]' \
                | sed 's#[^a-z0-9._-]#-#g' \
                | sed 's/^-*//' \
                | sed 's/-*$//')"

              if [ "$safe_branch" = "$normalized_branch" ]; then
                found="true"
                break
              fi
            done < /tmp/emhass-branches.txt

            if [ "$found" = "false" ]; then
              echo "Removing orphan add-on: $addon_dir"
              rm -rf "$addon_dir"
              removed="$removed $addon_dir"
            else
              echo "Keeping $addon_dir because its source branch still exists."
            fi
          done < <(find . -mindepth 1 -maxdepth 1 -type d -name "emhass-*" -printf "%f\n")

          echo "removed=$removed" >> "$GITHUB_OUTPUT"

      - name: Commit orphan cleanup
        if: steps.cleanup.outputs.removed != ''
        shell: bash
        env:
          REMOVED: ${{ steps.cleanup.outputs.removed }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi

          git commit -m "Remove orphaned branch add-ons:${REMOVED}"
          git push
