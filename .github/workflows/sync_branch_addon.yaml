name: Sync Branch Addon (Auto)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch in emhass repo'
        required: true
        default: 'master'
        type: string
      target_branch:
        description: 'Target branch in emhass-add-on repo'
        required: true
        default: 'main'
        type: string
  repository_dispatch:
    types: [sync-addon]

jobs:
  sync-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout emhass-add-on
        uses: actions/checkout@v4
        with:
          path: emhass-add-on
          ref: ${{ github.event.client_payload.target_branch || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout emhass repo
        uses: actions/checkout@v4
        with:
          repository: JoshC1994/emhass
          ref: ${{ github.event.client_payload.source_branch || 'master' }}
          path: emhass
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync emhass into addon
        run: |
          cd emhass-add-on
          
          # Remove old emhass code (but keep addon config)
          rm -rf emhass/CHANGELOG.md emhass/DOCS.md emhass/README.md emhass/Test.md emhass/config.yml emhass/icon.png emhass/logo.png emhass/images emhass/translations
          
          # Copy new emhass code
          cp -r ../emhass/. emhass/
          
          echo "Synced emhass from branch: ${{ github.event.client_payload.source_branch || 'master' }}"

      - name: Get version from emhass
        id: version
        run: |
          cd emhass
          # Get version from pyproject.toml
          BASE_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2 || echo "0.18.1")
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
          
          # Get emhass commit SHA
          EMHASS_SHA=$(git rev-parse --short=7 HEAD)
          echo "EMHASS_SHA=$EMHASS_SHA" >> $GITHUB_OUTPUT

      - name: Get addon commit SHA
        id: addon_commit
        run: |
          cd emhass-add-on
          ADDON_SHA=$(git rev-parse --short=7 HEAD)
          echo "ADDON_SHA=$ADDON_SHA" >> $GITHUB_OUTPUT

      - name: Get target branch name
        id: branch
        run: |
          TARGET_BRANCH="${{ github.event.client_payload.target_branch || 'main' }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          
          # Clean branch name for display
          CLEAN_BRANCH=$(echo "$TARGET_BRANCH" | tr '/' '-' | tr '_' '-')
          echo "CLEAN_BRANCH=$CLEAN_BRANCH" >> $GITHUB_OUTPUT

      - name: Update addon config.yml
        run: |
          cd emhass-add-on
          
          TARGET_BRANCH="${{ steps.branch.outputs.TARGET_BRANCH }}"
          CLEAN_BRANCH="${{ steps.branch.outputs.CLEAN_BRANCH }}"
          BASE_VERSION="${{ steps.version.outputs.BASE_VERSION }}"
          ADDON_SHA="${{ steps.addon_commit.outputs.ADDON_SHA }}"
          
          # Set version format: v{emhass_version}-{addon_commit_sha}
          FULL_VERSION="v${BASE_VERSION}-${ADDON_SHA}"
          
          # Set name based on branch
          if [ "$TARGET_BRANCH" = "main" ]; then
            NEW_NAME="EMHASS - master"
          else
            NEW_NAME="EMHASS - ${CLEAN_BRANCH}"
          fi
          
          # Update version in config.yml
          sed -i "s/^version: .*/version: \"$FULL_VERSION\"/" emhass/config.yml
          
          # Update name in config.yml
          sed -i "s/^name: .*/name: \"$NEW_NAME\"/" emhass/config.yml
          
          echo "Updated addon:"
          echo "  Name: $NEW_NAME"
          echo "  Version: $FULL_VERSION"
          echo "  Branch: $TARGET_BRANCH"
          echo "  Synced from emhass version: $BASE_VERSION"

      - name: Commit and push changes
        run: |
          cd emhass-add-on
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TARGET_BRANCH="${{ steps.branch.outputs.TARGET_BRANCH }}"
            BASE_VERSION="${{ steps.version.outputs.BASE_VERSION }}"
            git commit -m "Auto-sync from emhass v${BASE_VERSION} for $TARGET_BRANCH"
            git push origin "$TARGET_BRANCH"
          fi

      - name: Create Git tag
        run: |
          cd emhass-add-on
          TARGET_BRANCH="${{ steps.branch.outputs.TARGET_BRANCH }}"
          BASE_VERSION="${{ steps.version.outputs.BASE_VERSION }}"
          ADDON_SHA="${{ steps.addon_commit.outputs.ADDON_SHA }}"
          
          # Create version tag
          TAG_NAME="v${BASE_VERSION}-${ADDON_SHA}"
          
          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, skipping"
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG_NAME" -m "Auto-release $TAG_NAME for $TARGET_BRANCH"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag: $TAG_NAME"
          fi
