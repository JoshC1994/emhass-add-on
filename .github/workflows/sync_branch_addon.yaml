name: Sync Branch Addon with Auto-Tag

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch in emhass repo (e.g., master)'
        required: true
        default: 'master'
        type: string
      target_branch:
        description: 'Target branch in emhass-add-on repo (e.g., main)'
        required: true
        default: 'main'
        type: string

jobs:
  sync-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout emhass-add-on
        uses: actions/checkout@v4
        with:
          path: emhass-add-on
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout emhass repo
        uses: actions/checkout@v4
        with:
          repository: JoshC1994/emhass
          ref: ${{ github.event.inputs.source_branch || 'master' }}
          path: emhass
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync emhass into addon
        run: |
          cd emhass-add-on
          # Remove old emhass code (but keep addon config)
          rm -rf emhass/CHANGELOG.md emhass/DOCS.md emhass/README.md emhass/Test.md emhass/config.yml emhass/icon.png emhass/logo.png emhass/images emhass/translations
          
          # Copy new emhass code
          cp -r ../emhass/. emhass/
          
          # Restore addon-specific files
          # (they were not deleted, so they remain)

      - name: Get version from emhass
        id: version
        run: |
          cd emhass
          # Try to get version from pyproject.toml
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2 || echo "0.18.1")
          echo "BASE_VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # Get short commit SHA
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          
          # Combined version
          FULL_VERSION="v${VERSION}-${SHORT_SHA}"
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Update addon config.yml
        run: |
          cd emhass-add-on
          sed -i "s/^version: .*/version: \"${{ steps.version.outputs.FULL_VERSION }}\"/" emhass/config.yml
          echo "Updated addon version to ${{ steps.version.outputs.FULL_VERSION }}"

      - name: Commit and push changes
        run: |
          cd emhass-add-on
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from emhass ${{ steps.version.outputs.FULL_VERSION }}"
            git push origin ${{ github.event.inputs.target_branch || 'main' }}
          fi

      - name: Create Git tag
        run: |
          cd emhass-add-on
          TAG_NAME="${{ steps.version.outputs.FULL_VERSION }}"
          
          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, skipping"
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG_NAME" -m "Auto-release $TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag: $TAG_NAME"
          fi
