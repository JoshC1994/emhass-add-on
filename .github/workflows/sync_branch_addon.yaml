name: Sync branch add-on from emhass repository dispatch

on:
  repository_dispatch:
    types: [emhass-branch-updated, emhass-branch-deleted]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name in emhass repo'
        required: true
      slug:
        description: 'Slug to use for the add-on folder (lowercase, hyphenated)'
        required: true
      run_number:
        description: 'Build/run number to use as the add-on version'
        required: false
        default: '1'
      is_master:
        description: 'Whether this branch is master/main'
        required: false
        default: 'false'
      action:
        description: 'update or delete'
        required: false
        default: 'update'

permissions:
  contents: write

env:
  UPSTREAM_OWNER: JoshC1994
  UPSTREAM_REPO: emhass
  # Folder/identity used for the master build. This intentionally
  # matches the add-on you already have installed in Home Assistant
  # (emhass/config.yml) so it keeps receiving updates instead of
  # becoming a second, unrelated add-on entry.
  MASTER_FOLDER: emhass

jobs:
  update-addon:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'update') || github.event.action == 'emhass-branch-updated'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout add-on repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: in
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "slug=${{ github.event.inputs.slug }}" >> "$GITHUB_OUTPUT"
            echo "run_number=${{ github.event.inputs.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_master=${{ github.event.inputs.is_master }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.client_payload.branch }}" >> "$GITHUB_OUTPUT"
            echo "slug=${{ github.event.client_payload.slug }}" >> "$GITHUB_OUTPUT"
            echo "run_number=${{ github.event.client_payload.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_master=${{ github.event.client_payload.is_master }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update master add-on (version bump only)
        if: steps.in.outputs.is_master == 'true'
        env:
          VERSION: ${{ steps.in.outputs.run_number }}
        run: |
          set -euo pipefail
          FOLDER="${{ env.MASTER_FOLDER }}"

          # Only the version line is managed automatically. Everything
          # else in config.yml (name, slug, schema, options, map, etc.)
          # is left exactly as you've configured it, so your existing
          # installed add-on is not disturbed.
          sed -i.bak "s/^version:.*/version: \"${VERSION}\"/" "$FOLDER/config.yml"
          rm -f "$FOLDER/config.yml.bak"

          # Safety: remove a stray config.yaml if one ever gets created
          # here by mistake - having both config.yml and config.yaml in
          # the same folder confuses the Supervisor about which add-on
          # definition to use.
          rm -f "$FOLDER/config.yaml"

      - name: Determine branch add-on folder
        if: steps.in.outputs.is_master != 'true'
        id: folder
        run: |
          echo "folder=emhass-${{ steps.in.outputs.slug }}" >> "$GITHUB_OUTPUT"
          echo "addon_name=EMHASS - ${{ steps.in.outputs.branch }}" >> "$GITHUB_OUTPUT"

      - name: Create or update branch add-on folder
        if: steps.in.outputs.is_master != 'true'
        env:
          FOLDER: ${{ steps.folder.outputs.folder }}
          ADDON_NAME: ${{ steps.folder.outputs.addon_name }}
          BRANCH: ${{ steps.in.outputs.branch }}
          SLUG: ${{ steps.in.outputs.slug }}
          VERSION: ${{ steps.in.outputs.run_number }}
          OWNER_LC_INPUT: ${{ env.UPSTREAM_OWNER }}
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "$OWNER_LC_INPUT" | tr '[:upper:]' '[:lower:]')
          mkdir -p "$FOLDER"

          IMAGE_REPO="emhass-${SLUG}"
          SLUG_FIELD="emhass_${SLUG//-/_}"

          # Remove a legacy .yml file if this folder was ever created
          # by an older version of this workflow, so only one config
          # file exists.
          rm -f "$FOLDER/config.yml"

          cat > "$FOLDER/config.yaml" <<EOF
          name: "${ADDON_NAME}"
          version: "${VERSION}"
          slug: "${SLUG_FIELD}"
          description: "EMHASS build from branch '${BRANCH}' (auto-published)"
          url: "https://github.com/${OWNER_LC}/emhass"
          arch:
            - amd64
            - aarch64
            - armv7
          init: false
          startup: application
          boot: auto
          hassio_api: true
          hassio_role: default
          homeassistant_api: true
          ingress: true
          ingress_port: 5000
          ingress_stream: true
          panel_icon: mdi:home-battery
          webui: http://[HOST]:[PORT:5000]
          ports:
            5000/tcp: 5000
          ports_description:
            5000/tcp: "EMHASS web server (branch: ${BRANCH})"
          map:
            - share:rw
            - type: addon_config
              path: /config
              read_only: false
          options:
            data_path: "/share/emhass"
          schema:
            data_path: "list(default|/config|/data|/share|/share/emhass)?"
          image: "ghcr.io/${OWNER_LC}/${IMAGE_REPO}"
          EOF

          for asset in icon.png logo.png DOCS.md; do
            if [ -f "${{ env.MASTER_FOLDER }}/$asset" ]; then
              cp -f "${{ env.MASTER_FOLDER }}/$asset" "$FOLDER/$asset"
            fi
          done

          cat > "$FOLDER/README.md" <<EOF
          # ${ADDON_NAME}

          Auto-published test build of EMHASS from branch \`${BRANCH}\` in
          [${OWNER_LC}/emhass](https://github.com/${OWNER_LC}/emhass).

          - Source commit build number: ${VERSION}
          - This add-on is generated and updated automatically. Do not edit by hand;
            changes will be overwritten on the next push to the branch.
          - Removing the branch from the emhass repo will remove this add-on
            automatically (or via the daily cleanup job).
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync add-on for branch '${{ steps.in.outputs.branch }}' build ${{ steps.in.outputs.run_number }}"
            git push
          fi

  delete-addon:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'delete') || github.event.action == 'emhass-branch-deleted'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout add-on repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: in
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ github.event.inputs.slug }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "slug=${{ github.event.client_payload.slug }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.client_payload.branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove add-on folder for deleted branch
        env:
          SLUG: ${{ steps.in.outputs.slug }}
          BRANCH: ${{ steps.in.outputs.branch }}
        run: |
          set -euo pipefail
          FOLDER="emhass-${SLUG}"
          if [ "$BRANCH" = "master" ] || [ "$BRANCH" = "main" ]; then
            echo "Refusing to delete the main '${{ env.MASTER_FOLDER }}' add-on folder."
            exit 0
          fi
          if [ -d "$FOLDER" ]; then
            git rm -r --ignore-unmatch "$FOLDER"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove add-on ${FOLDER}: branch '${BRANCH}' deleted"
            git push
          else
            echo "Folder ${FOLDER} does not exist, nothing to remove."
          fi
